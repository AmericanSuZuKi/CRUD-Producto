<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trabajo Práctico - CRUD de Productos</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    form { margin-bottom: 20px; max-width: 400px; display: flex; flex-direction: column; gap: 10px; }
    input { padding: 8px; font-size: 14px; }
    button { padding: 8px 12px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: left; vertical-align: middle; }
    th { background-color: #f4f4f4; }
    img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
    .btn-eliminar { background-color: #ff4d4d; color: white; border: none; border-radius: 4px; padding: 6px 12px; }
  </style>
</head>
<body>

  <h1>Gestión de Productos</h1>

  <form id="form-producto">
    <h3>Agregar Producto</h3>
    <input type="text" id="codigo" placeholder="Código" required>
    <input type="text" id="nombre" placeholder="Nombre del Producto" required>
    <input type="number" step="0.01" id="precio" placeholder="Precio ($)" required>
    <input type="url" id="imagen" placeholder="URL de la imagen" required>
    <button type="submit">Agregar Producto</button>
  </form>

  <h2>Listado de Productos</h2>
  <table>
    <thead>
      <tr>
        <th>Imagen</th>
        <th>Código</th>
        <th>Nombre</th>
        <th>Precio</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="lista-productos">
    </tbody>
  </table>

  <script type="module" src="index.js"></script>
</body>
</html>
